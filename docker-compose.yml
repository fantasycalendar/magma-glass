version: '3.8'

services:
    magmaglass:
        container_name: magma_glass
        build:
            context: .
        volumes:
            - ./storage/notes:/app/storage/notes
        ports:
            - "${APP_PORT:-9981}:8080"
        environment:
            - APP_ENV=${APP_ENV:-production}
        depends_on:
            - redis

    redis:
        image: redis:7-alpine
        container_name: magma_glass_redis
        ports:
            - "${REDIS_PORT:-6379}:6379"
